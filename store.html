<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D PRINT - المتجر الإلكتروني</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Supabase JS SDK Modular -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    // قم باستبدال القيم التالية ببيانات مشروعك الخاصة بـ Supabase
    const SUPABASE_URL = "https://zqkyzkozpbatfjgeclel.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rlwWoh5XpYyxSXaNYJegdg_Qu6LOx7C";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    window.supabase = supabase;
    
    document.addEventListener("DOMContentLoaded", () => {
      loadCategories();
      loadProducts();
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #030305; color: #ffffff; min-height: 100vh; padding: 25px 15px; position: relative; overflow-x: hidden; }
    .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle at 50% 10%, rgba(0, 210, 255, 0.08) 0%, rgba(3, 3, 5, 0.98) 70%); z-index: -1; pointer-events: none; }
    .nav-bar { max-width: 1100px; margin: 0 auto 25px auto; display: flex; justify-content: space-between; align-items: center; }
    .back-btn { color: #00d2ff; text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
    .back-btn:hover { color: #ff0055; transform: translateX(5px); }
    .cart-trigger { background: rgba(0, 210, 255, 0.15); border: 1px solid #00d2ff; color: #fff; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 10px; transition: 0.3s; box-shadow: 0 0 15px rgba(0, 210, 255, 0.2); }
    .cart-trigger:hover { background: #00d2ff; color: #000; box-shadow: 0 0 25px rgba(0, 210, 255, 0.5); }
    .cart-count { background: #ff0055; color: #fff; font-size: 0.8rem; padding: 2px 7px; border-radius: 50%; }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 2.2rem; background: linear-gradient(135deg, #ffffff, #00d2ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .header p { color: #8a90a2; font-size: 0.95rem; }

    /* --- قائمة التصنيفات المنسدلة --- */
    .cat-dropdown-wrapper { position: relative; max-width: 350px; margin: 0 auto 35px auto; }
    .cat-dropdown-btn { width: 100%; padding: 12px 20px; background: rgba(18, 22, 33, 0.9); border: 1px solid rgba(0, 210, 255, 0.4); border-radius: 12px; color: #fff; font-size: 1rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; backdrop-filter: blur(10px); }
    .cat-dropdown-btn:hover, .cat-dropdown-btn.active { border-color: #00d2ff; box-shadow: 0 0 15px rgba(0, 210, 255, 0.25); }
    .cat-dropdown-btn i { transition: transform 0.3s ease; color: #00d2ff; }
    .cat-dropdown-btn.active i { transform: rotate(180deg); }

    .cat-dropdown-menu { position: absolute; top: calc(100% + 8px); right: 0; left: 0; background: rgba(18, 22, 33, 0.98); border: 1px solid rgba(0, 210, 255, 0.3); border-radius: 12px; max-height: 250px; overflow-y: auto; display: none; flex-direction: column; z-index: 100; backdrop-filter: blur(15px); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .cat-dropdown-menu.show { display: flex; }
    .cat-option { padding: 12px 18px; color: #a0a5b5; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); transition: 0.2s; display: flex; align-items: center; justify-content: space-between; }
    .cat-option:last-child { border-bottom: none; }
    .cat-option:hover, .cat-option.selected { background: rgba(0, 210, 255, 0.15); color: #00d2ff; font-weight: 600; padding-right: 24px; }

    /* Scrollbar المربع عند كثرة التصنيفات */
    .cat-dropdown-menu::-webkit-scrollbar { width: 6px; }
    .cat-dropdown-menu::-webkit-scrollbar-thumb { background: #00d2ff; border-radius: 10px; }
    .cat-dropdown-menu::-webkit-scrollbar-track { background: rgba(8, 10, 15, 0.8); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; max-width: 1100px; margin: 0 auto; }
    .card { background: rgba(18, 22, 33, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; overflow: hidden; transition: all 0.3s ease; display: flex; flex-direction: column; backdrop-filter: blur(10px); cursor: pointer; }
    .card:hover { transform: translateY(-7px); border-color: #00d2ff; box-shadow: 0 8px 25px rgba(0, 210, 255, 0.25); }
    .card-img-wrapper { width: 100%; height: 220px; overflow: hidden; position: relative; background: #080a0f; }
    .card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .card:hover img { transform: scale(1.08); }
    .card-body { padding: 18px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 1.1rem; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .card-desc { font-size: 0.85rem; color: #8a90a2; margin-bottom: 15px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 12px; }
    .price { font-size: 1.1rem; font-weight: bold; color: #00d2ff; }
    .view-btn { background: rgba(0, 210, 255, 0.15); border: 1px solid #00d2ff; color: #fff; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.3s; display: flex; align-items: center; gap: 6px; }
    .card:hover .view-btn { background: #00d2ff; color: #000; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); padding: 20px; }
    .modal-overlay.active { display: flex; }
    .product-modal-content { background: rgba(18, 22, 33, 0.95); border: 1px solid rgba(0, 210, 255, 0.3); border-radius: 20px; width: 100%; max-width: 750px; max-height: 90vh; overflow-y: auto; padding: 25px; box-shadow: 0 0 35px rgba(0, 0, 0, 0.9); display: flex; gap: 25px; position: relative; }
    @media (max-width: 650px) { .product-modal-content { flex-direction: column; } }
    .modal-close-icon { position: absolute; top: 15px; left: 15px; color: #8a90a2; font-size: 1.5rem; cursor: pointer; transition: 0.2s; z-index: 10; }
    .modal-close-icon:hover { color: #ff0055; }
    .modal-gallery { flex: 1; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
    .modal-main-img { width: 100%; height: 240px; border-radius: 12px; overflow: hidden; background: #080a0f; border: 1px solid rgba(255, 255, 255, 0.1); }
    .modal-main-img img { width: 100%; height: 100%; object-fit: cover; }
    .modal-thumbs-grid { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
    .modal-thumb { width: 55px; height: 55px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 2px solid transparent; opacity: 0.6; transition: 0.2s; }
    .modal-thumb.active, .modal-thumb:hover { border-color: #00d2ff; opacity: 1; }
    .modal-details { flex: 1.2; display: flex; flex-direction: column; justify-content: space-between; }
    .modal-title { font-size: 1.5rem; color: #fff; margin-bottom: 8px; padding-left: 30px; }
    .modal-desc { font-size: 0.9rem; color: #a0a5b5; margin-bottom: 20px; line-height: 1.5; }
    .options-group { margin-bottom: 15px; }
    .options-group label { display: block; font-size: 0.85rem; color: #00d2ff; margin-bottom: 6px; font-weight: 600; }
    .options-group select { width: 100%; padding: 10px; background: rgba(8, 10, 15, 0.9); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none; }
    .modal-price-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; padding-top: 15px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
    .modal-price { font-size: 1.4rem; font-weight: bold; color: #00d2ff; }
    .add-to-cart-modal-btn { background: linear-gradient(135deg, #ff0055, #ff5500); border: none; color: #fff; padding: 12px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.95rem; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
    .add-to-cart-modal-btn:hover { box-shadow: 0 0 20px rgba(255, 0, 85, 0.5); transform: scale(1.02); }
    .cart-content { background: rgba(18, 22, 33, 0.95); border: 1px solid rgba(0, 210, 255, 0.3); border-radius: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 25px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); }
    .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 12px; }
    .cart-header h2 { color: #00d2ff; font-size: 1.3rem; }
    .cart-items { max-height: 250px; overflow-y: auto; margin-bottom: 20px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 0.9rem; }
    .cart-item-details { display: flex; flex-direction: column; gap: 4px; }
    .qty-controls { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .qty-btn { background: rgba(255, 255, 255, 0.1); border: none; color: #fff; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .qty-btn:hover { background: #00d2ff; color: #000; }
    .remove-item { color: #ff4757; cursor: pointer; margin-left: 8px; }
    .cart-total { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; margin-bottom: 20px; color: #fff; }
    .cart-inputs input { width: 100%; padding: 12px; background: rgba(8, 10, 15, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #fff; margin-bottom: 12px; outline: none; }
    .checkout-btn { width: 100%; padding: 14px; background: #25D366; border: none; border-radius: 10px; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
    .checkout-btn:hover { background: #1ebc57; box-shadow: 0 0 15px rgba(37, 211, 102, 0.4); }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="nav-bar">
    <a href="dashboard.html" class="back-btn">
      <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
    </a>
    <button class="cart-trigger" onclick="toggleCart(true)">
      <i class="fa-solid fa-cart-shopping"></i> السلة
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>

  <div class="header">
    <h1><i class="fa-solid fa-store"></i> متجر المجسمات الجاهزة</h1>
    <p>تصفح أرقى التصاميم المطبوعة بدقة فائقة واطلبها مباشرة إلى باب منزلك</p>
  </div>

  <!-- زرار التصنيفات المنسدل مع Scrollbar مخصص -->
  <div class="cat-dropdown-wrapper">
    <button class="cat-dropdown-btn" id="catBtn" onclick="toggleCategoryMenu()">
      <span><i class="fa-solid fa-layer-group" style="color:#00d2ff; margin-left:8px;"></i> <span id="selectedCatText">الكل (جميع التصنيفات)</span></span>
      <i class="fa-solid fa-chevron-down"></i>
    </button>

    <div class="cat-dropdown-menu" id="catMenu">
      <div class="cat-option selected" onclick="selectCategory('all', 'الكل (جميع التصنيفات)')">
        <span>الكل (جميع التصنيفات)</span>
        <i class="fa-solid fa-check"></i>
      </div>
      <!-- سيتم تحميل التصنيفات هنا ديناميكياً -->
    </div>
  </div>

  <div class="grid" id="storeGrid">
    <p style="grid-column: 1/-1; text-align: center; color: #8a90a2; padding: 40px;">جاري تحميل المنتجات من المتجر...</p>
  </div>

  <div class="modal-overlay" id="productModal">
    <div class="product-modal-content">
      <i class="fa-solid fa-xmark modal-close-icon" onclick="closeProductModal()"></i>
      
      <div class="modal-gallery">
        <div class="modal-main-img">
          <img id="modalMainImg" src="" alt="صورة المنتج الرئيسية">
        </div>
        <div class="modal-thumbs-grid" id="modalThumbsGrid"></div>
      </div>

      <div class="modal-details">
        <div>
          <h2 class="modal-title" id="modalProductTitle">اسم المنتج</h2>
          <p class="modal-desc" id="modalProductDesc">وصف المنتج الكامل يظهر هنا...</p>

          <div class="options-group">
            <label><i class="fa-solid fa-palette"></i> اختر اللون:</label>
            <select id="modalColorSelect"></select>
          </div>

          <div class="options-group">
            <label><i class="fa-solid fa-ruler-combined"></i> اختر المقاس والأبعاد:</label>
            <select id="modalSizeSelect" onchange="updateModalPrice()"></select>
          </div>
        </div>

        <div class="modal-price-bar">
          <div class="modal-price" id="modalPriceDisplay">0 ج.م</div>
          <button class="add-to-cart-modal-btn" id="modalAddBtn">
            <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="cartModal">
    <div class="cart-content">
      <div class="cart-header">
        <h2><i class="fa-solid fa-cart-shopping"></i> سلة المشتريات</h2>
        <i class="fa-solid fa-xmark modal-close-icon" onclick="toggleCart(false)"></i>
      </div>

      <div class="cart-items" id="cartItems"></div>

      <div class="cart-total">
        <span>الإجمالي:</span>
        <span id="cartTotal" style="color: #00d2ff;">0 ج.م</span>
      </div>

      <div class="cart-inputs">
        <input type="text" id="custName" placeholder="الاسم الكريم">
        <input type="tel" id="custPhone" placeholder="رقم الواتساب">
        <input type="text" id="custAddress" placeholder="العنوان بالتفصيل">
      </div>

      <button class="checkout-btn" onclick="checkoutWhatsApp()">
        <i class="fa-brands fa-whatsapp"></i> تأكيد الطلب عبر الواتساب
      </button>
    </div>
  </div>

  <script>
    let cart = [];
    let currentCategory = 'all';
    let allProducts = [];

    // إظهار وإخفاء قائمة التصنيفات
    function toggleCategoryMenu() {
      const btn = document.getElementById('catBtn');
      const menu = document.getElementById('catMenu');
      btn.classList.toggle('active');
      menu.classList.toggle('show');
    }

    // إغلاق قائمة التصنيفات عند الضغط في أي مكان خارجي
    document.addEventListener('click', function(e) {
      const wrapper = document.querySelector('.cat-dropdown-wrapper');
      if (wrapper && !wrapper.contains(e.target)) {
        document.getElementById('catBtn').classList.remove('active');
        document.getElementById('catMenu').classList.remove('show');
      }
    });

    // اختيار تصنيف من المربع
    function selectCategory(catKey, catLabel) {
      currentCategory = catKey;
      document.getElementById('selectedCatText').innerText = catLabel;

      toggleCategoryMenu();
      renderFilteredProducts();
    }

    // جلب التصنيفات واستماع التحديثات الحية عبر Supabase
    async function loadCategories() {
      const menu = document.getElementById('catMenu');
      
      const fetchCategories = async () => {
        const { data, error } = await window.supabase
          .from('categories')
          .select('*');

        if (error) {
          console.error("خطأ في جلب التصنيفات:", error);
          return;
        }

        renderCategoriesMenu(data || []);
      };

      await fetchCategories();

      // الاشتراك في التحديثات المباشرة Realtime
      window.supabase
        .channel('categories_realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, () => {
          fetchCategories();
        })
        .subscribe();
    }

    function renderCategoriesMenu(categories) {
      const menu = document.getElementById('catMenu');
      let html = `
        <div class="cat-option ${currentCategory === 'all' ? 'selected' : ''}" onclick="selectCategory('all', 'الكل (جميع التصنيفات)')">
          <span>الكل (جميع التصنيفات)</span>
          <i class="fa-solid fa-check"></i>
        </div>
      `;

      categories.forEach((cat) => {
        const catName = cat.name;
        const isSelected = currentCategory === catName ? 'selected' : '';
        html += `
          <div class="cat-option ${isSelected}" onclick="selectCategory('${catName}', '${catName}')">
            <span>${catName}</span>
            <i class="fa-solid fa-check"></i>
          </div>
        `;
      });

      menu.innerHTML = html;
    }

    // جلب المنتجات واستماع التحديثات الحية عبر Supabase
    async function loadProducts() {
      const container = document.getElementById('storeGrid');

      const fetchProducts = async () => {
        const { data, error } = await window.supabase
          .from('products')
          .select('*');

        if (error) {
          console.error("خطأ في جلب المنتجات:", error);
          container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #ff4757; padding: 40px;">حدث خطأ أثناء تحميل المنتجات.</p>';
          return;
        }

        allProducts = data || [];
        renderFilteredProducts();
      };

      await fetchProducts();

      // الاشتراك في التحديثات المباشرة Realtime للمنتجات
      window.supabase
        .channel('products_realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => {
          fetchProducts();
        })
        .subscribe();
    }

    function renderFilteredProducts() {
      const container = document.getElementById('storeGrid');
      const filtered = currentCategory === 'all' 
        ? allProducts 
        : allProducts.filter(p => p.category === currentCategory);

      if (filtered.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #8a90a2; padding: 40px;">لا توجد منتجات في هذا القسم.</p>';
        return;
      }

      container.innerHTML = '';
      filtered.forEach(p => {
        let minPrice = '0';
        if (p.sizes && Array.isArray(p.sizes) && p.sizes.length > 0) {
          minPrice = p.sizes[0].price;
        } else if (p.price) {
          minPrice = p.price;
        }

        let mainImg = Array.isArray(p.images) && p.images.length > 0 ? p.images[0] : (p.image || 'https://via.placeholder.com/300');

        container.innerHTML += `
          <div class="card" onclick="openProductModal('${p.id}')">
            <div class="card-img-wrapper">
              <img src="${mainImg}" alt="${p.name}">
            </div>
            <div class="card-body">
              <div>
                <div class="card-title">${p.name}</div>
                <div class="card-desc">${p.desc || 'طباعة ثلاثية الأبعاد دقة عالية.'}</div>
              </div>
              <div class="price-row">
                <div class="price">يبدأ من ${minPrice} ج.م</div>
                <button class="view-btn"><i class="fa-solid fa-eye"></i> التفاصيل</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    function openProductModal(productId) {
      const product = allProducts.find(p => String(p.id) === String(productId));
      if (!product) return;

      document.getElementById('modalProductTitle').innerText = product.name;
      document.getElementById('modalProductDesc').innerText = product.desc || 'طباعة ثلاثية الأبعاد دقة عالية.';

      const imagesList = Array.isArray(product.images) && product.images.length > 0 ? product.images : [product.image || 'https://via.placeholder.com/300'];
      const mainImgElem = document.getElementById('modalMainImg');
      const thumbsContainer = document.getElementById('modalThumbsGrid');
      
      mainImgElem.src = imagesList[0];
      thumbsContainer.innerHTML = '';

      imagesList.forEach((imgSrc, index) => {
        thumbsContainer.innerHTML += `<img src="${imgSrc}" class="modal-thumb ${index === 0 ? 'active' : ''}" onclick="changeMainImage('${imgSrc}', this)">`;
      });

      const colorSelect = document.getElementById('modalColorSelect');
      colorSelect.innerHTML = '';
      if (product.colors && Array.isArray(product.colors) && product.colors.length > 0) {
        product.colors.forEach(c => { colorSelect.innerHTML += `<option value="${c}">${c}</option>`; });
      } else {
        colorSelect.innerHTML = '<option value="الافتراضي">الافتراضي</option>';
      }

      const sizeSelect = document.getElementById('modalSizeSelect');
      sizeSelect.innerHTML = '';
      if (product.sizes && Array.isArray(product.sizes) && product.sizes.length > 0) {
        product.sizes.forEach(s => {
          sizeSelect.innerHTML += `<option value="${s.name}" data-price="${s.price}" data-dims="${s.l}×${s.w}×${s.h} سم">${s.name} (${s.l}×${s.w}×${s.h} سم) - ${s.price} ج.م</option>`;
        });
      } else {
        sizeSelect.innerHTML = `<option value="قياسي" data-price="${product.price || 0}" data-dims="قياسي">قياسي</option>`;
      }

      updateModalPrice();
      document.getElementById('modalAddBtn').onclick = function() { addToCartFromModal(product.name); };
      document.getElementById('productModal').classList.add('active');
    }

    function changeMainImage(src, thumbElem) {
      document.getElementById('modalMainImg').src = src;
      document.querySelectorAll('.modal-thumb').forEach(t => t.classList.remove('active'));
      thumbElem.classList.add('active');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.remove('active');
    }

    function updateModalPrice() {
      const select = document.getElementById('modalSizeSelect');
      const selectedOption = select.options[select.selectedIndex];
      const price = selectedOption ? selectedOption.getAttribute('data-price') : '0';
      document.getElementById('modalPriceDisplay').innerText = price + ' ج.م';
    }

    function addToCartFromModal(productName) {
      const colorSelect = document.getElementById('modalColorSelect');
      const sizeSelect = document.getElementById('modalSizeSelect');
      const selectedColor = colorSelect.value;
      const selectedSizeName = sizeSelect.value;
      const selectedOption = sizeSelect.options[sizeSelect.selectedIndex];
      const unitPrice = Number(selectedOption.getAttribute('data-price'));
      const dims = selectedOption.getAttribute('data-dims');

      const existingIndex = cart.findIndex(item => item.name === productName && item.color === selectedColor && item.sizeName === selectedSizeName);
      if (existingIndex > -1) {
        cart[existingIndex].qty += 1;
      } else {
        cart.push({ name: productName, unitPrice, price: unitPrice, color: selectedColor, sizeName: selectedSizeName, dims, qty: 1 });
      }
      
      closeProductModal();
      updateCartUI();
      toggleCart(true);
    }

    function toggleCart(show) {
      const modal = document.getElementById('cartModal');
      if (show) {
        modal.classList.add('active');
      } else {
        modal.classList.remove('active');
      }
    }

    function changeQty(index, change) {
      cart[index].qty += change;
      if (cart[index].qty <= 0) { cart.splice(index, 1); }
      updateCartUI();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      let totalCount = 0;
      cart.forEach(item => totalCount += item.qty);
      document.getElementById('cartCount').innerText = totalCount;

      const itemsContainer = document.getElementById('cartItems');
      const totalSpan = document.getElementById('cartTotal');
      itemsContainer.innerHTML = '';

      if (cart.length === 0) {
        itemsContainer.innerHTML = '<p style="text-align:center; color:#8a90a2; padding:20px;">السلة فارغة حالياً.</p>';
        totalSpan.innerText = '0 ج.م';
        return;
      }

      let totalPrice = 0;
      cart.forEach((item, index) => {
        let itemTotal = item.unitPrice * item.qty;
        totalPrice += itemTotal;

        itemsContainer.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-details">
              <strong>${item.name}</strong>
              <span style="font-size:0.75rem; color:#8a90a2;">اللون: ${item.color} | المقاس: ${item.sizeName}</span>
              <span style="color:#00d2ff; font-size:0.85rem;">${item.unitPrice} ج.م × ${item.qty} = ${itemTotal} ج.م</span>
              <div class="qty-controls">
                <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                <span>${item.qty}</span>
                <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
              </div>
            </div>
            <i class="fa-solid fa-trash remove-item" onclick="removeFromCart(${index})" title="حذف"></i>
          </div>
        `;
      });

      totalSpan.innerText = totalPrice + ' ج.م';
    }

    function checkoutWhatsApp() {
      if (cart.length === 0) {
        alert('السلة فارغة!');
        return;
      }

      const name = document.getElementById('custName').value.trim();
      const phone = document.getElementById('custPhone').value.trim();
      const address = document.getElementById('custAddress').value.trim();

      if (!name || !phone || !address) {
        alert('يرجى إكمال بيانات الشحن (الاسم، رقم الواتساب، والعنوان)!');
        return;
      }

      let message = `🛒 *طلب جديد من المتجر* 3D Print\n\n`;
      message += `👤 *الاسم:* ${name}\n`;
      message += `📞 *الهاتف:* ${phone}\n`;
      message += `📍 *العنوان:* ${address}\n\n`;
      message += `📦 *المنتجات المطلوبة:*\n`;

      let total = 0;
      cart.forEach((item, i) => {
        let sub = item.unitPrice * item.qty;
        total += sub;
        message += `${i+1}. ${item.name}\n   - المقاس: ${item.sizeName} (${item.dims})\n   - اللون: ${item.color}\n   - الكمية: ${item.qty} | السعر: ${sub} ج.م\n\n`;
      });

      message += `💰 *الإجمالي الكلي:* ${total} ج.م`;

      const ownerPhone = "201061182930"; 
      const encodedUrl = `https://wa.me/${ownerPhone}?text=${encodeURIComponent(message)}`;
      window.open(encodedUrl, '_blank');
    }
  </script>
</body>
