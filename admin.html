<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم - إدارة المتجر</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS Client -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://zqkyzkozpbatfjgeclel.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rlwWoh5XpYyxSXaNYJegdg_Qu6LOx7C";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    window.supabase = supabase;

    // بدء الاستماع للبيانات فور تحميل الصفحة
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof window.initAdminListeners === "function") {
        window.initAdminListeners();
      }
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #030305; color: #fff; min-height: 100vh; padding: 30px 15px; display: flex; flex-direction: column; align-items: center; position: relative; }
    .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle at 50% 20%, rgba(255, 0, 85, 0.08) 0%, rgba(3, 3, 5, 0.98) 70%); z-index: -1; pointer-events: none; }
    
    .login-card, .admin-container {
      background: rgba(18, 22, 33, 0.9); border: 1px solid rgba(0, 210, 255, 0.3);
      padding: 35px 25px; border-radius: 20px; width: 100%; max-width: 650px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
    }
    .login-card { text-align: center; max-width: 400px; margin-top: 60px; }
    .admin-container { display: none; }
    
    .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
    .header-admin h2 { color: #00d2ff; font-size: 1.5rem; }
    .logout-btn { color: #ff4757; cursor: pointer; font-weight: bold; }

    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; color: #e0e5f0; font-size: 0.9rem; font-weight: 600; }
    input, select, textarea {
      width: 100%; padding: 12px; background: rgba(8, 10, 15, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s;
    }
    input:focus, select:focus, textarea:focus { border-color: #ff0055; box-shadow: 0 0 10px rgba(255,0,85,0.3); }

    .img-preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .img-preview-wrapper { position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(0, 210, 255, 0.4); }
    .img-preview-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .img-preview-wrapper .remove-img-btn {
      position: absolute; top: 3px; right: 3px; background: rgba(255, 71, 87, 0.85); color: #fff;
      border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer;
    }

    .colors-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px;
      background: rgba(8, 10, 15, 0.5); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    }
    .colors-grid label { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; color: #cbd5e1; font-weight: normal; }
    .colors-grid input[type="checkbox"] { width: auto; accent-color: #ff0055; cursor: pointer; }

    .size-row {
      display: flex; gap: 8px; align-items: center; margin-bottom: 10px;
      background: rgba(8, 10, 15, 0.5); padding: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    }
    .size-row input { padding: 8px; font-size: 0.85rem; }
    .add-size-btn, .submit-btn, .cancel-btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px; color: #fff; font-weight: bold; cursor: pointer; transition: 0.3s;
    }
    .add-size-btn { background: rgba(0, 210, 255, 0.2); border: 1px dashed #00d2ff; color: #00d2ff; margin-bottom: 15px; }
    .add-size-btn:hover { background: rgba(0, 210, 255, 0.3); }
    .submit-btn { background: linear-gradient(135deg, #ff0055, #ff5500); font-size: 1rem; margin-top: 10px; }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,0,85,0.4); }
    
    .cancel-btn { background: rgba(255, 255, 255, 0.1); margin-top: 8px; display: none; }
    .cancel-btn:hover { background: rgba(255, 255, 255, 0.2); }

    .products-section, .categories-manager-section { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
    .product-row, .category-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 12px; border-radius: 10px; margin-bottom: 10px; }
    .product-thumb { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
    .action-btns { display: flex; gap: 12px; align-items: center; }
    .edit-icon { color: #00d2ff; cursor: pointer; font-size: 1.1rem; }
    .delete-icon { color: #ff4757; cursor: pointer; font-size: 1.1rem; }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="login-card" id="loginCard">
    <h2><i class="fa-solid fa-user-shield"></i> دخول الإدارة</h2>
    <p style="color:#8a90a2; margin: 15px 0;">أدخل كلمة السر</p>
    <div class="form-group">
      <input type="password" id="passInput" placeholder="كلمة السر...">
    </div>
    <button class="submit-btn" onclick="login()">دخول</button>
  </div>

  <div class="admin-container" id="adminContainer">
    <div class="header-admin">
      <h2 id="formTitle"><i class="fa-solid fa-sliders"></i> لوحة التحكم - إضافة منتج</h2>
      <span class="logout-btn" onclick="logout()">خروج</span>
    </div>

    <input type="hidden" id="editProductId" value="">

    <div class="form-group">
      <label>اسم المنتج</label>
      <input type="text" id="pName" placeholder="مثال: مجسم جوكو دراجون بول">
    </div>

    <div class="form-group">
      <label>القسم</label>
      <select id="pCategory">
        <!-- سيتم جلب التصنيفات ديناميكياً -->
      </select>
    </div>

    <div class="form-group">
      <label>صور المنتج (اختيار أكثر من صورة - يتم ضغطها تلقائياً للسرعة)</label>
      <input type="file" id="pImgFile" accept="image/*" multiple onchange="handleImageSelection(event)">
      <div class="img-preview-grid" id="imgPreviewGrid"></div>
    </div>

    <div class="form-group">
      <label>الألوان المتوفرة:</label>
      <div class="colors-grid" id="colorsCheckboxes">
        <label><input type="checkbox" value="أسود"> أسود</label>
        <label><input type="checkbox" value="أبيض"> أبيض</label>
        <label><input type="checkbox" value="رمادي"> رمادي</label>
        <label><input type="checkbox" value="أحمر"> أحمر</label>
        <label><input type="checkbox" value="أزرق"> أزرق</label>
        <label><input type="checkbox" value="أصفر"> أصفر</label>
        <label><input type="checkbox" value="أخضر"> أخضر</label>
        <label><input type="checkbox" value="برتقالي"> برتقالي</label>
        <label><input type="checkbox" value="بنفسجي"> بنفسجي</label>
        <label><input type="checkbox" value="ذهبي"> ذهبي</label>
        <label><input type="checkbox" value="فضي"> فضي</label>
        <label><input type="checkbox" value="شفاف"> شفاف</label>
        <label><input type="checkbox" value="بني"> بني</label>
        <label><input type="checkbox" value="وردي"> وردي</label>
        <label><input type="checkbox" value="سماوي"> سماوي</label>
        <label><input type="checkbox" value="متعدد الألوان (Multi-color)" style="color:#00d2ff; font-weight:bold;">✨ متعدد الألوان</label>
      </div>
    </div>

    <div class="form-group">
      <label>المقاسات والأسعار:</label>
      <div id="sizesContainer">
        <div class="size-row">
          <input type="text" placeholder="اسم المقاس (مثال: صغير)" class="s-name" style="flex:2;">
          <input type="number" placeholder="طول (سم)" class="s-l" style="flex:1;">
          <input type="number" placeholder="عرض (سم)" class="s-w" style="flex:1;">
          <input type="number" placeholder="ارتفاع (سم)" class="s-h" style="flex:1;">
          <input type="number" placeholder="السعر (ج.م)" class="s-price" style="flex:1.2;">
        </div>
      </div>
      <button type="button" class="add-size-btn" onclick="addSizeRow()"><i class="fa-solid fa-plus"></i> إضافة مقاس وسعر آخر</button>
    </div>

    <div class="form-group">
      <label>وصف المنتج</label>
      <textarea id="pDesc" rows="2" placeholder="وصف موجز للمواصفات..."></textarea>
    </div>

    <button class="submit-btn" id="saveBtn" onclick="saveProduct()">نشر المنتج في المتجر</button>
    <button class="cancel-btn" id="cancelEditBtn" onclick="resetForm()">إلغاء التعديل</button>

    <div class="products-section">
      <h3 style="color: #00d2ff; margin-bottom: 12px; font-size: 1.1rem;">المنتجات الحالية:</h3>
      <div id="productList"></div>
    </div>

    <div class="categories-manager-section">
      <h3 style="color: #00d2ff; margin-bottom: 15px; font-size: 1.2rem;"><i class="fa-solid fa-layer-group"></i> إدارة تصنيفات المتجر</h3>
      
      <div class="form-group">
        <label>إضافة تصنيف جديد</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="newCategoryName" placeholder="اسم التصنيف الجديد">
          <button type="button" class="submit-btn" style="margin-top:0; width: 140px;" onclick="addNewCategory()">إضافة</button>
        </div>
      </div>

      <div style="margin-top: 20px;">
        <h4 style="color: #e0e5f0; margin-bottom: 10px; font-size: 0.95rem;">التصنيفات الحالية:</h4>
        <div id="categoriesListContainer">
          <p style="color:#8a90a2; font-size: 0.85rem;">جاري تحميل التصنيفات...</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const ADMIN_PASS = "wafaa11223344";
    let selectedImagesBase64 = [];
    let cachedProducts = {}; 

    window.initAdminListeners = function() {
      fetchAndListenProducts();
      fetchAndListenCategories();
    };

    function login() {
      if (document.getElementById('passInput').value === ADMIN_PASS) {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('adminContainer').style.display = 'block';
      } else {
        alert('كلمة السر غير صحيحة!');
      }
    }

    function logout() {
      document.getElementById('adminContainer').style.display = 'none';
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('passInput').value = '';
    }

    // دالة ضغط الصور لتقليل الحجم وتسريع التحميل
    function compressImage(file, maxWidth = 800, quality = 0.7) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL('image/jpeg', quality));
          };
        };
      });
    }

    async function handleImageSelection(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      for (let file of Array.from(files)) {
        const compressedBase64 = await compressImage(file);
        selectedImagesBase64.push(compressedBase64);
      }
      renderImagePreviews();
    }

    function removeImage(index) {
      selectedImagesBase64.splice(index, 1);
      renderImagePreviews();
    }

    function renderImagePreviews() {
      const container = document.getElementById('imgPreviewGrid');
      container.innerHTML = '';
      selectedImagesBase64.forEach((imgData, idx) => {
        container.innerHTML += `
          <div class="img-preview-wrapper">
            <img src="${imgData}">
            <div class="remove-img-btn" onclick="removeImage(${idx})"><i class="fa-solid fa-xmark"></i></div>
          </div>
        `;
      });
    }

    function addSizeRow(data = {}) {
      const container = document.getElementById('sizesContainer');
      const row = document.createElement('div');
      row.className = 'size-row';
      row.innerHTML = `
        <input type="text" placeholder="اسم المقاس (مثال: كبير)" class="s-name" value="${data.name || ''}" style="flex:2;">
        <input type="number" placeholder="طول" class="s-l" value="${data.l ?? ''}" style="flex:1;">
        <input type="number" placeholder="عرض" class="s-w" value="${data.w ?? ''}" style="flex:1;">
        <input type="number" placeholder="ارتفاع" class="s-h" value="${data.h ?? ''}" style="flex:1;">
        <input type="number" placeholder="السعر" class="s-price" value="${data.price ?? ''}" style="flex:1.2;">
        <i class="fa-solid fa-trash" style="color:#ff4757; cursor:pointer; padding:5px;" onclick="this.parentElement.remove()"></i>
      `;
      container.appendChild(row);
    }

    // جلب وتحديث المنتجات فورياً من Supabase
    async function fetchAndListenProducts() {
      renderProductsList();

      // التحديث اللحظي عبر Realtime Subscription
      window.supabase
        .channel('products-channel')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => {
          renderProductsList();
        })
        .subscribe();
    }

    async function renderProductsList() {
      const container = document.getElementById('productList');
      
      const { data, error } = await window.supabase
        .from('products')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error("خطأ في جلب المنتجات: ", error);
        container.innerHTML = '<p style="color:#ff4757">حدث خطأ أثناء تحميل المنتجات.</p>';
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<p style="color:#8a90a2">لا توجد منتجات بعد.</p>';
        cachedProducts = {};
        return;
      }

      container.innerHTML = '';
      cachedProducts = {};

      data.forEach((p) => {
        cachedProducts[p.id] = p;

        let sizesList = typeof p.sizes === 'string' ? JSON.parse(p.sizes) : (p.sizes || []);
        let imagesList = typeof p.images === 'string' ? JSON.parse(p.images) : (p.images || []);

        let firstPrice = sizesList.length > 0 ? sizesList[0].price : '0';
        let mainImg = Array.isArray(imagesList) && imagesList.length > 0 ? imagesList[0] : 'https://via.placeholder.com/300';
        let imgCount = Array.isArray(imagesList) ? imagesList.length : 1;

        container.innerHTML += `
          <div class="product-row">
            <div style="display:flex; align-items:center; gap:12px;">
              <img src="${mainImg}" class="product-thumb">
              <div>
                <strong>${p.name}</strong> <span style="font-size:0.75rem; color:#8a90a2;">(${imgCount} صور)</span>
                <div style="color:#00d2ff; font-size:0.8rem;">يبدأ من ${firstPrice} ج.م</div>
              </div>
            </div>
            <div class="action-btns">
              <i class="fa-solid fa-pen-to-square edit-icon" title="تعديل المنتج" onclick="editProduct('${p.id}')"></i>
              <i class="fa-solid fa-trash delete-icon" title="حذف المنتج" onclick="deleteProduct('${p.id}')"></i>
            </div>
          </div>
        `;
      });
    }

    // جلب وتحديث التصنيفات فورياً من Supabase
    async function fetchAndListenCategories() {
      renderCategoriesList();

      window.supabase
        .channel('categories-channel')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'categories' }, () => {
          renderCategoriesList();
        })
        .subscribe();
    }

    async function renderCategoriesList() {
      const selectElement = document.getElementById('pCategory');
      const listContainer = document.getElementById('categoriesListContainer');

      const { data, error } = await window.supabase
        .from('categories')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        console.error("خطأ في تحميل التصنيفات:", error);
        return;
      }

      selectElement.innerHTML = '';
      listContainer.innerHTML = '';

      if (!data || data.length === 0) {
        selectElement.innerHTML = '<option value="">لا توجد تصنيفات متاحة</option>';
        listContainer.innerHTML = '<p style="color:#8a90a2; font-size: 0.85rem;">لا توجد تصنيفات مضافة حتى الآن.</p>';
        return;
      }

      data.forEach((cat) => {
        selectElement.innerHTML += `<option value="${cat.name}">${cat.name}</option>`;

        listContainer.innerHTML += `
          <div class="category-row">
            <span style="font-weight: 600; font-size: 0.9rem;"><i class="fa-solid fa-tag" style="color:#ff0055; margin-left: 8px;"></i> ${cat.name}</span>
            <i class="fa-solid fa-trash delete-icon" title="حذف التصنيف" onclick="deleteCategory('${cat.id}', '${cat.name}')"></i>
          </div>
        `;
      });
    }

    async function addNewCategory() {
      const input = document.getElementById('newCategoryName');
      const catName = input.value.trim();

      if (!catName) {
        alert('يرجى كتابة اسم التصنيف الجديد!');
        return;
      }

      const { error } = await window.supabase
        .from('categories')
        .insert([{ name: catName }]);

      if (error) {
        console.error("خطأ في إضافة التصنيف:", error);
        alert('حدث خطأ أثناء إضافة التصنيف.');
      } else {
        input.value = '';
        renderCategoriesList();
      }
    }

    async function deleteCategory(catId, catName) {
      if (confirm(`هل أنت متأكد من حذف التصنيف "${catName}"؟`)) {
        const { error } = await window.supabase
          .from('categories')
          .delete()
          .eq('id', catId);

        if (error) {
          console.error("خطأ في حذف التصنيف:", error);
          alert('حدث خطأ أثناء حذف التصنيف.');
        } else {
          renderCategoriesList();
        }
      }
    }

    function saveProduct() {
      const name = document.getElementById('pName').value.trim();
      const category = document.getElementById('pCategory').value;
      const desc = document.getElementById('pDesc').value.trim();
      const editId = document.getElementById('editProductId').value;

      if (!name || !category) {
        alert('يرجى كتابة اسم المنتج واختيار التصنيف!');
        return;
      }

      const selectedColors = [];
      document.querySelectorAll('#colorsCheckboxes input[type="checkbox"]:checked').forEach(cb => {
        selectedColors.push(cb.value);
      });

      if (selectedColors.length === 0) {
        alert('يرجى اختيار لون واحد على الأقل!');
        return;
      }

      const sizeRows = document.querySelectorAll('.size-row');
      const sizesData = [];
      let hasError = false;

      sizeRows.forEach(row => {
        const sName = row.querySelector('.s-name').value.trim() || 'قياسي';
        const length = parseFloat(row.querySelector('.s-l').value) || 0;
        const width = parseFloat(row.querySelector('.s-w').value) || 0;
        const height = parseFloat(row.querySelector('.s-h').value) || 0;
        const priceVal = row.querySelector('.s-price').value.trim();
        const price = parseFloat(priceVal);

        if (!priceVal || isNaN(price)) hasError = true;
        sizesData.push({ name: sName, l: length, w: width, h: height, price: price });
      });

      if (hasError || sizesData.length === 0) {
        alert('يرجى تحديد السعر لكل مقاس!');
        return;
      }

      const finalImages = selectedImagesBase64.length > 0 
        ? selectedImagesBase64 
        : ['https://via.placeholder.com/300'];

      storeProductData(editId, name, category, finalImages, selectedColors, sizesData, desc);
    }

    async function storeProductData(editId, name, category, images, colors, sizes, description) {
      try {
        const payload = {
          name,
          category,
          images,
          colors,
          sizes,
          description
        };

        if (editId) {
          const { error } = await window.supabase
            .from('products')
            .update(payload)
            .eq('id', editId);

          if (error) throw error;
          alert('تم تحديث المنتج بنجاح!');
        } else {
          const { error } = await window.supabase
            .from('products')
            .insert([payload]);

          if (error) throw error;
          alert('تم نشر المنتج بنجاح!');
        }

        resetForm();
        renderProductsList();
      } catch (error) {
        console.error("خطأ أثناء الحفظ: ", error);
        alert('حدث خطأ أثناء الحفظ، يرجى المحاولة مرة أخرى.');
      }
    }

    function editProduct(id) {
      const product = cachedProducts[id];
      if (!product) return;

      document.getElementById('editProductId').value = product.id;
      document.getElementById('pName').value = product.name;
      document.getElementById('pCategory').value = product.category;
      document.getElementById('pDesc').value = product.description || product.desc || '';

      let imagesList = typeof product.images === 'string' ? JSON.parse(product.images) : (product.images || []);
      selectedImagesBase64 = Array.isArray(imagesList) ? [...imagesList] : [];
      renderImagePreviews();

      let colorsList = typeof product.colors === 'string' ? JSON.parse(product.colors) : (product.colors || []);
      document.querySelectorAll('#colorsCheckboxes input').forEach(cb => {
        cb.checked = Array.isArray(colorsList) && colorsList.includes(cb.value);
      });

      let sizesList = typeof product.sizes === 'string' ? JSON.parse(product.sizes) : (product.sizes || []);
      const sizesContainer = document.getElementById('sizesContainer');
      sizesContainer.innerHTML = '';
      if (Array.isArray(sizesList) && sizesList.length > 0) {
        sizesList.forEach(sz => addSizeRow(sz));
      } else {
        addSizeRow();
      }

      document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square"></i> لوحة التحكم - تعديل منتج';
      document.getElementById('saveBtn').innerText = 'حفظ التعديلات';
      document.getElementById('cancelEditBtn').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editProductId').value = '';
      document.getElementById('pName').value = '';
      document.getElementById('pDesc').value = '';
      document.getElementById('pImgFile').value = '';
      selectedImagesBase64 = [];
      renderImagePreviews();

      document.querySelectorAll('#colorsCheckboxes input').forEach(cb => cb.checked = false);
      
      document.getElementById('sizesContainer').innerHTML = '';
      addSizeRow();

      document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-sliders"></i> لوحة التحكم - إضافة منتج';
      document.getElementById('saveBtn').innerText = 'نشر المنتج في المتجر';
      document.getElementById('cancelEditBtn').style.display = 'none';
    }

    async function deleteProduct(id) {
      if (confirm('حذف هذا المنتج من المتجر تماماً؟')) {
        const { error } = await window.supabase
          .from('products')
          .delete()
          .eq('id', id);

        if (error) {
          console.error("خطأ أثناء الحذف: ", error);
          alert('حدث خطأ أثناء الحذف.');
        } else {
          renderProductsList();
        }
      }
    }
  </script>
</body>
