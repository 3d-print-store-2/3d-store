<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D PRINT - Cinema Intro</title>
  
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- GSAP Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #030305;
      color: #ffffff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* خلفية الصورة */
    .hero-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(3, 3, 5, 0.1) 0%, rgba(3, 3, 5, 0.98) 85%),
                  url('watermarked_img_6321258455534373014.jpg') center/cover no-repeat;
      z-index: 1;
      filter: blur(2px);
      transform: scale(1.1);
    }

    /* WebGL Canvas */
    #webgl-canvas {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    /* واجهة اللوجو والنصوص */
    .intro-overlay {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      pointer-events: none;
      padding: 0 15px;
    }

    .main-logo {
      font-size: 5.5rem;
      font-weight: 900;
      letter-spacing: 8px;
      background: linear-gradient(135deg, #ffffff 20%, #00d2ff 70%, #ff0055 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 40px rgba(0, 210, 255, 0.6);
      opacity: 0;
      transform: scale(0.3);
      margin: 10px 0;
    }

    .sub-title {
      font-size: 1.2rem;
      color: #00d2ff;
      letter-spacing: 5px;
      opacity: 0;
    }

    /* شريط التحميل في منتصف الأسفل */
    .loading-container {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 260px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      z-index: 4;
    }

    .loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00d2ff, #ff0055);
      box-shadow: 0 0 15px #00d2ff;
    }

    /* فلاش الانفجار */
    .screen-flash {
      position: absolute;
      inset: 0;
      background: #ffffff;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
    }

    /* تحسينات خصيصاً لشاشات الموبايل */
    @media (max-width: 768px) {
      .main-logo {
        font-size: 3.2rem !important;
        letter-spacing: 4px !important;
      }

      .sub-title {
        font-size: 0.85rem !important;
        letter-spacing: 2px !important;
      }

      .loading-container {
        width: 180px;
        bottom: 30px;
      }
    }
  </style>
</head>
<body>

  <div class="hero-bg" id="heroBg"></div>
  <canvas id="webgl-canvas"></canvas>

  <div class="intro-overlay">
    <div class="main-logo" id="mainLogo">3D PRINT</div>
    <div class="sub-title" id="subTitle">PRECISION & CREATIVITY</div>
  </div>

  <div class="loading-container">
    <div class="loading-bar" id="progressBar"></div>
  </div>

  <div class="screen-flash" id="flash"></div>

  <script>
    // --- 1. THREE.JS SCENE SETUP ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 28);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // LIGHTS & GLOWING ORBS
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambientLight);

    // ضوء أزرق + كرة نيون متوهجة
    const blueLight = new THREE.PointLight(0x00d2ff, 15, 60);
    const blueOrbGeom = new THREE.SphereGeometry(0.9, 32, 32);
    const blueOrbMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
    const blueOrb = new THREE.Mesh(blueOrbGeom, blueOrbMat);
    blueLight.add(blueOrb);
    scene.add(blueLight);

    // ضوء أحمر/فوشيا + كرة نيون متوهجة
    const redLight = new THREE.PointLight(0xff0055, 15, 60);
    const redOrbGeom = new THREE.SphereGeometry(0.9, 32, 32);
    const redOrbMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
    const redOrb = new THREE.Mesh(redOrbGeom, redOrbMat);
    redLight.add(redOrb);
    scene.add(redLight);

    // الأطراف الابتدائية
    blueLight.position.set(-35, 18, -5);
    redLight.position.set(35, -18, -5);

    // نبض متوهج للكرات
    gsap.to(blueOrb.scale, { x: 1.4, y: 1.4, z: 1.4, duration: 0.35, yoyo: true, repeat: -1, ease: "sine.inOut" });
    gsap.to(redOrb.scale, { x: 1.4, y: 1.4, z: 1.4, duration: 0.35, yoyo: true, repeat: -1, ease: "sine.inOut" });

    // --- 2. HIGH-DETAIL 3D SKULL OBJECT ---
    const skullGroup = new THREE.Group();

    // خامة ميكانيكية حادة بظلال قوية توضح تفاصيل المجسم
    const skullMaterial = new THREE.MeshStandardMaterial({
      color: 0x222836,
      metalness: 0.85,
      roughness: 0.2,
      flatShading: true
    });

    // الجمجمة العلوية
    const headGeom = new THREE.IcosahedronGeometry(3.6, 2);
    const headMesh = new THREE.Mesh(headGeom, skullMaterial);
    skullGroup.add(headMesh);

    // تجاويف العيون
    const socketGeom = new THREE.CylinderGeometry(0.9, 0.7, 1.2, 8);
    const socketMat = new THREE.MeshBasicMaterial({ color: 0x05070a });
    
    const leftSocket = new THREE.Mesh(socketGeom, socketMat);
    leftSocket.rotation.x = Math.PI / 2;
    leftSocket.position.set(1.2, 0.5, 2.8);
    skullGroup.add(leftSocket);

    const rightSocket = new THREE.Mesh(socketGeom, socketMat);
    rightSocket.rotation.x = Math.PI / 2;
    rightSocket.position.set(-1.2, 0.5, 2.8);
    skullGroup.add(rightSocket);

    // العيون المضيئة الداخليّة
    const eyeGeom = new THREE.SphereGeometry(0.35, 16, 16);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
    
    const leftEye = new THREE.Mesh(eyeGeom, eyeMat);
    leftEye.position.set(1.2, 0.5, 3.1);
    skullGroup.add(leftEye);

    const rightEye = new THREE.Mesh(eyeGeom, eyeMat);
    rightEye.position.set(-1.2, 0.5, 3.1);
    skullGroup.add(rightEye);

    // الفك السفلي
    const jawGeom = new THREE.BoxGeometry(3.2, 1.6, 2.8);
    const jawMesh = new THREE.Mesh(jawGeom, skullMaterial);
    jawMesh.position.set(0, -2.6, 0.6);
    skullGroup.add(jawMesh);

    // كباري وجسر الأنف الميكانيكي
    const noseGeom = new THREE.ConeGeometry(0.4, 1.2, 4);
    const noseMesh = new THREE.Mesh(noseGeom, skullMaterial);
    noseMesh.position.set(0, -0.4, 3.2);
    skullGroup.add(noseMesh);

    scene.add(skullGroup);
    skullGroup.scale.set(0.001, 0.001, 0.001);

    // --- 3. SHOCKWAVE & EXPLOSION PARTICLES ---
    const ringGeom = new THREE.RingGeometry(0.1, 0.5, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0 });
    const shockwave = new THREE.Mesh(ringGeom, ringMat);
    scene.add(shockwave);

    const particleCount = 60;
    const particleGeom = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    const particleVelocities = [];

    for (let i = 0; i < particleCount; i++) {
      particlePositions[i * 3] = 0;
      particlePositions[i * 3 + 1] = 0;
      particlePositions[i * 3 + 2] = 5;

      particleVelocities.push({
        x: (Math.random() - 0.5) * 25,
        y: (Math.random() - 0.5) * 25,
        z: (Math.random() - 0.5) * 25
      });
    }

    particleGeom.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0x00d2ff,
      size: 0.4,
      transparent: true,
      opacity: 0
    });
    const sparkParticles = new THREE.Points(particleGeom, particleMat);
    scene.add(sparkParticles);

    // --- 4. ANIMATION & COLLISION ---
    const lightAnim = { angle: 0, radius: 28, z: -5 };

    gsap.to(lightAnim, {
      angle: Math.PI * 6,
      radius: 0,
      z: 5,
      duration: 2.8,
      ease: "power2.in",
      onUpdate: () => {
        blueLight.position.x = Math.cos(lightAnim.angle) * lightAnim.radius;
        blueLight.position.y = Math.sin(lightAnim.angle) * lightAnim.radius;
        blueLight.position.z = lightAnim.z;

        redLight.position.x = Math.cos(lightAnim.angle + Math.PI) * lightAnim.radius;
        redLight.position.y = Math.sin(lightAnim.angle + Math.PI) * lightAnim.radius;
        redLight.position.z = lightAnim.z;
      },
      onComplete: createCollisionExplosion
    });

    gsap.to('#progressBar', { width: '100%', duration: 6, ease: 'linear' });

    function createCollisionExplosion() {
      blueOrb.visible = false;
      redOrb.visible = false;

      // 1. تفعيل موجة التصادم
      shockwave.position.set(0, 0, 5);
      shockwave.material.opacity = 1;
      gsap.to(shockwave.scale, { x: 50, y: 50, z: 50, duration: 0.8, ease: "power2.out" });
      gsap.to(shockwave.material, { opacity: 0, duration: 0.8 });

      // 2. تناثر الشرارات
      particleMat.opacity = 1;
      let pPositions = sparkParticles.geometry.attributes.position.array;
      gsap.to(particleMat, { opacity: 0, duration: 0.9, delay: 0.2 });

      gsap.to({}, {
        duration: 0.8,
        onUpdate: () => {
          for (let i = 0; i < particleCount; i++) {
            pPositions[i * 3] += particleVelocities[i].x * 0.03;
            pPositions[i * 3 + 1] += particleVelocities[i].y * 0.03;
            pPositions[i * 3 + 2] += particleVelocities[i].z * 0.03;
          }
          sparkParticles.geometry.attributes.position.needsUpdate = true;
        }
      });

      // 3. الفلاش الأبيض
      gsap.to('#flash', {
        opacity: 1,
        duration: 0.1,
        yoyo: true,
        repeat: 1,
        ease: 'power4.inOut'
      });

      blueLight.position.set(15, 12, 12);
      redLight.position.set(-15, -12, 10);
      blueLight.intensity = 18;
      redLight.intensity = 18;

      gsap.to(skullGroup.scale, {
        x: 1, y: 1, z: 1,
        duration: 1.2,
        ease: "elastic.out(1, 0.4)"
      });

      gsap.to('#mainLogo', {
        opacity: 1,
        scale: 1,
        duration: 0.8,
        ease: "back.out(2)"
      });

      gsap.to('#subTitle', {
        opacity: 1,
        duration: 0.6,
        delay: 0.3
      });

      gsap.to(camera.position, {
        z: 6,
        duration: 1.2,
        delay: 2.2,
        ease: "expo.in",
        onComplete: () => {
          gsap.to('#flash', {
            opacity: 1,
            duration: 0.4,
            onComplete: () => {
              // الانتقال التلقائي لصفحة الداشبورد
              window.location.href = "dashboard.html";
            }
          });
        }
      });
    }

    // --- 5. RENDER LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      if (skullGroup.scale.x > 0.1) {
        skullGroup.rotation.y += 0.008;
        skullGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.12;
      }

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
