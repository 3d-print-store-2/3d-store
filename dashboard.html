<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Print Forge - عالم الطباعة ثلاثية الأبعاد</title>
  
  <!-- Three.js & GSAP Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #08080c;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Hero Container */
    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Canvas للـ 3D Scene */
    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Overlay للتظليل والعمق */
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(8, 8, 12, 0.2) 0%, rgba(8, 8, 12, 0.85) 80%);
      z-index: 2;
      pointer-events: none;
    }

    /* المحتوى والنصوص */
    .hero-content {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 800px;
      padding: 0 20px;
      pointer-events: none; /* لتسمح بالماوس بالتفاعل مع الكانفاس */
    }

    .hero-content * {
      pointer-events: auto; /* إعادة تفعيل الماوس للأزرار والنصوص */
    }

    .tagline {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(0, 210, 255, 0.1);
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 20px;
      color: #00d2ff;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 20px;
      backdrop-filter: blur(5px);
    }

    .hero-content h1 {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 30%, #00d2ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0, 210, 255, 0.2);
    }

    .hero-content p {
      font-size: 1.2rem;
      color: #a0a5b5;
      margin-bottom: 35px;
      line-height: 1.6;
    }

    /* الأزرار */
    .btn-group {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 36px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: #00d2ff;
      color: #08080c;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
      border: none;
    }

    .btn-primary:hover {
      background: #33dcfd;
      box-shadow: 0 0 35px rgba(0, 210, 255, 0.7);
      transform: translateY(-3px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: #00d2ff;
      color: #00d2ff;
      transform: translateY(-3px);
    }

    @media (max-width: 768px) {
      .hero-content h1 { font-size: 2.2rem; }
      .hero-content p { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <!-- WebGL Canvas for 3D Background & Transformation -->
    <canvas id="webgl-canvas"></canvas>
    
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <span class="tagline"> 3D PRINTING</span>
      <h1>من خيالك.. إلى واقع ملموس</h1>
      <p>نحول أفكارك وتصاميمك المخصصة إلى مجسمات حقيقية بأعلى دقة، بالإضافة إلى متجر متكامل للمنتجات الجاهزة للاقتناء.</p>
      
      <div class="btn-group">
        <a href="store.html" class="btn btn-primary">تصفح المنتجات الجاهزة</a>
        <a href="custom-order.html" class="btn btn-secondary">طلب مجسم خاص</a>
      </div>
    </div>
  </section>

  <script>
    // --- 1. SETUP THREE.JS SCENE ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    
    // إضافة ضباب لإعطاء عمق للمشهد
    scene.fog = new THREE.FogExp2(0x08080c, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 40;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // --- 2. LIGHTS ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0x00d2ff, 2); // نيون أزرق
    dirLight1.position.set(20, 20, 20);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xff007f, 1.5); // نيون ورودي خفيف للتباين
    dirLight2.position.set(-20, -20, -10);
    scene.add(dirLight2);

    // --- 3. CREATE TRANSFORMING 3D ASSEMBLY ---
    const assemblyGroup = new THREE.Group();
    scene.add(assemblyGroup);

    const pieces = [];
    const numPieces = 120; // عدد أجزاء المجسم الميكانيكي

    // مادة التصنيع (Metallic Dark Material)
    const material = new THREE.MeshStandardMaterial({
      color: 0x1a1d24,
      metalness: 0.8,
      roughness: 0.2,
      wireframe: false
    });

    // إنشاء قطع مكعبة وهندسية تتجمع لتشكل كرة ميكانيكية ضخمة
    for (let i = 0; i < numPieces; i++) {
      const size = Math.random() * 1.5 + 0.5;
      const geometry = new THREE.BoxGeometry(size, size, size * 2);
      const mesh = new THREE.Mesh(geometry, material);

      // موقع القطعة النهائي (الهدف داخل الكرة)
      const phi = Math.acos(-1 + (2 * i) / numPieces);
      const theta = Math.sqrt(numPieces * Math.PI) * phi;
      const radius = 12;

      const targetX = radius * Math.sin(phi) * Math.cos(theta);
      const targetY = radius * Math.sin(phi) * Math.sin(theta);
      const targetZ = radius * Math.cos(phi);

      // حفظ الهدف
      mesh.userData = {
        targetX, targetY, targetZ,
        targetRotX: Math.random() * Math.PI,
        targetRotY: Math.random() * Math.PI
      };

      // البداية: بعثرة القطع بعيداً في الفضاء
      mesh.position.set(
        (Math.random() - 0.5) * 200,
        (Math.random() - 0.5) * 200,
        (Math.random() - 0.5) * 200
      );

      mesh.rotation.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);

      assemblyGroup.add(mesh);
      pieces.push(mesh);
    }

    // --- 4. GSAP REASSEMBLY ANIMATION ---
    pieces.forEach((piece, index) => {
      gsap.to(piece.position, {
        x: piece.userData.targetX,
        y: piece.userData.targetY,
        z: piece.userData.targetZ,
        duration: 2.5 + Math.random(),
        ease: "power4.out",
        delay: index * 0.01 // تتابع سريع جداً في حركة القطع
      });

      gsap.to(piece.rotation, {
        x: piece.userData.targetRotX,
        y: piece.userData.targetRotY,
        duration: 2.5 + Math.random(),
        ease: "power4.out",
        delay: index * 0.01
      });
    });

    // --- 5. MOUSE INTERACTION & ANIMATION LOOP ---
    let mouseX = 0;
    let mouseY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX / window.innerWidth - 0.5) * 0.5;
      mouseY = (e.clientY / window.innerHeight - 0.5) * 0.5;
    });

    function animate() {
      requestAnimationFrame(animate);

      // دوران بطيء مستمر للمجسم
      assemblyGroup.rotation.y += 0.003;
      assemblyGroup.rotation.x += 0.001;

      // التفاعل الناعم مع الماوس
      camera.position.x += (mouseX * 10 - camera.position.x) * 0.05;
      camera.position.y += (-mouseY * 10 - camera.position.y) * 0.05;
      camera.lookAt(scene.position);

      renderer.render(scene, camera);
    }

    animate();

    // --- 6. RESIZE HANDLER ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
